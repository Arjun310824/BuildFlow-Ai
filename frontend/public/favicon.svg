<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#2196F3" />
      <stop offset="100%" stopColor="#1677D2" />
    </linearGradient>
    <linearGradient id="deepNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#1565C0" />
      <stop offset="100%" stopColor="#0B4F9C" />
    </linearGradient>
    <linearGradient id="accentOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FF7A1A" />
      <stop offset="100%" stopColor="#FF6A00" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="rgba(11, 79, 156, 0.35)" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Outer Left Column - Shortest with Angled Top -->
    <path d="M8 32 L15 28 V58 H8 Z" fill="url(#primaryBlue)" />

    <!-- Mid-Left Column - Medium Height with Angled Top -->
    <path d="M18 25 L25 21 V58 H18 Z" fill="url(#deepNavy)" />

    <!-- Center Tower Left Column -->
    <path d="M27 21 L31 18 V58 H27 Z" fill="url(#deepNavy)" />

    <!-- Center Tower Right Column -->
    <path d="M33 18 L37 21 V58 H33 Z" fill="url(#deepNavy)" />

    <!-- Mid-Right Column - Medium Height with Descending Top -->
    <path d="M39 21 L46 25 V58 H39 Z" fill="url(#deepNavy)" />

    <!-- Outer Right Column - Shortest with Descending Top -->
    <path d="M49 28 L56 32 V58 H49 Z" fill="url(#primaryBlue)" />

    <!-- Central Upward Construction Arrow / Chevron (#FF6A00) -->
    <path d="M32 6 L44 18 H37 V28 H27 V18 H20 Z" fill="url(#accentOrange)" />

    <!-- Inner Highlight -->
    <path d="M32 11 L38 17 H35 V24 H29 V17 H26 Z" fill="#FFFFFF" opacity="0.3" />
  </g>
</svg>